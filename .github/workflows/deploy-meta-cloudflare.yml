name: Deploy Meta Actions to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/meta/meta-ads-actions/**"
      - ".github/workflows/deploy-meta-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: meta-ads-actions-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy Meta Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_DIR: services/meta/meta-ads-actions
      HEALTH_URL: https://meta-ads-actions.cuiabar.com/actions/health
      DEEP_HEALTH_URL: https://meta-ads-actions.cuiabar.com/actions/health/deep
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      META_ACTIONS_BEARER_TOKEN: ${{ secrets.META_ACTIONS_BEARER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.SERVICE_DIR }}
          command: deploy -c wrangler.jsonc

      - name: Public health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$HEALTH_URL" -o health.json
          cat health.json
          jq -e '.ok == true and .service == "meta-ads-actions"' health.json >/dev/null

      - name: Deep health check
        if: ${{ env.META_ACTIONS_BEARER_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer $META_ACTIONS_BEARER_TOKEN" \
            "$DEEP_HEALTH_URL" -o deep-health.json
          cat deep-health.json
          jq -e '.ok == true' deep-health.json >/dev/null

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Meta Actions → Cloudflare"
            echo "- Worker: \`meta-ads-actions\`"
            echo "- Domain: \`meta-ads-actions.cuiabar.com\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch/ref: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
